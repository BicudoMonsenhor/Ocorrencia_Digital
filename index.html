<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Ocorrência</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; }
    .form-container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2 class="mb-4 text-center">Registro de Ocorrência</h2>
  <form onsubmit="salvarOcorrencia(event)">
    <div class="mb-3">
      <label class="form-label">Nome do Aluno</label>
      <input type="text" class="form-control" id="nomeAluno" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Série</label>
      <select class="form-select" id="serie" required>
        <option value="">Selecione</option>
        <option>6º Ano A</option><option>6º Ano B</option><option>7º Ano A</option>
        <option>7º Ano B</option><option>8º Ano A</option><option>8º Ano B</option>
        <option>9º Ano A</option><option>9º Ano B</option><option>1ª Série A</option>
        <option>1ª Série B</option><option>2ª Série A</option><option>2ª Série B</option>
        <option>3ª Série A</option><option>3ª Série B</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Nome do Professor</label>
      <input type="text" class="form-control" id="professor" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Descrição da Ocorrência</label>
      <textarea class="form-control" id="descricao" rows="4" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Registrar</button>
  </form>
</div>

<!-- Firebase Versão Moderna (Modular) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyBNnS5LP-Ip7z4xfETaq3ky7iBSO0E9aIg",
      authDomain: "ocorrencia-2db76.firebaseapp.com",
      databaseURL: "https://ocorrencia-2db76-default-rtdb.firebaseio.com", // ✅ Adicionado
      projectId: "ocorrencia-2db76",
      storageBucket: "ocorrencia-2db76.appspot.com",
      messagingSenderId: "590272746909",
      appId: "1:590272746909:web:9e387d96eb261fee56cb74",
      measurementId: "G-YK1PKB4FT3"
    };
  
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
  
    // Função para salvar ocorrência
    window.salvarOcorrencia = function(event) {
      event.preventDefault();
      const nomeAluno = document.getElementById('nomeAluno').value;
      const serie = document.getElementById('serie').value;
      const professor = document.getElementById('professor').value;
      const descricao = document.getElementById('descricao').value;
      const dataHora = new Date().toLocaleString();
  
      push(ref(db, 'ocorrencias/'), {
        nomeAluno,
        serie,
        professor,
        descricao,
        dataHora
      })
      .then(() => {
        alert("Ocorrência registrada com sucesso!");
        event.target.reset();
      })
      .catch((error) => {
        alert("Erro ao registrar: " + error.message);
      });
    };
  </script>
  
</body>
</html>
