
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Ocorrências</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0078D4 0%, #005A9E 100%);
      margin: 0;
    }
    header {
      background-color: #003c70;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    .filtro {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    .linha-simples {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    .linha-simples:hover {
      background-color: #f0f0f0;
    }
    .detalhes {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .botoes {
      margin-top: 10px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 5px;
      border: none;
      margin-right: 8px;
      cursor: pointer;
    }
    .btn-pdf {
      background-color: #28a745;
      color: white;
    }
    .btn-del {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>
<body>
  <header>Sistema de Ocorrências</header>
  <div class="container">
    <div class="filtro">
      <input type="text" id="filtro" placeholder="Digite o nome do aluno..." />
    </div>
    <div id="listaCompacta">Carregando ocorrências...</div>
    <div id="detalhesAluno"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDBe67kG6oru6nUMTrazQFDeMlZWrWZbzY",
      authDomain: "registro-ocorrencia.firebaseapp.com",
      projectId: "registro-ocorrencia"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let todasOcorrencias = [];

    window.onload = async function () {
      const lista = document.getElementById("listaCompacta");
      lista.innerHTML = "";
      const snapshot = await db.collection("ocorrencias").orderBy("dataHora", "desc").get();
      snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id;
        todasOcorrencias.push(data);
        const item = document.createElement("div");
        item.className = "linha-simples";
        item.textContent = `${data.nomeAluno} - ${data.serie} - ${data.professor}`;
        lista.appendChild(item);
      });
    };

    document.getElementById("filtro").addEventListener("input", function () {
      const nome = this.value.trim().toLowerCase();
      const detalhes = document.getElementById("detalhesAluno");
      detalhes.innerHTML = "";
      if (nome.length < 3) return;

      const encontrados = todasOcorrencias.filter(o => o.nomeAluno.toLowerCase().includes(nome));
      if (encontrados.length === 0) {
        detalhes.innerHTML = "<p>Nenhuma ocorrência encontrada.</p>";
        return;
      }

      encontrados.forEach(data => {
        const div = document.createElement("div");
        div.className = "detalhes";
        div.innerHTML = `
          <h3>${data.nomeAluno}</h3>
          <p><strong>Série:</strong> ${data.serie}</p>
          <p><strong>Professor:</strong> ${data.professor}</p>
          <p><strong>Data:</strong> ${data.dataHora}</p>
          <p><strong>Ocorrências:</strong> ${data.ocorrencias.join(", ")}</p>
          <p><strong>Descrição:</strong> ${data.descricao}</p>
          <div class="botoes">
            <button class="btn btn-pdf" onclick="gerarPDF('${data.nomeAluno}', '${data.serie}', '${data.professor}', '${data.dataHora}', \`${data.ocorrencias.join(", ")}\`, \`${data.descricao}\`)">PDF</button>
            <button class="btn btn-del" onclick="excluir('${data.id}')">Excluir</button>
          </div>
        `;
        detalhes.appendChild(div);
      });
    });

    async function excluir(id) {
      if (confirm("Deseja mesmo excluir esta ocorrência?")) {
        await db.collection("ocorrencias").doc(id).delete();
        location.reload();
      }
    }

    function gerarPDF(nome, serie, professor, data, ocorrencias, descricao) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(14);
      doc.text(`Registro de Ocorrência`, 20, 20);
      doc.setFontSize(12);
      doc.text(`Aluno: ${nome}`, 20, 30);
      doc.text(`Série: ${serie}`, 20, 40);
      doc.text(`Professor: ${professor}`, 20, 50);
      doc.text(`Data: ${data}`, 20, 60);
      doc.text(`Ocorrências: ${ocorrencias}`, 20, 70);
      doc.text(`Descrição:`, 20, 80);
      doc.text(`${descricao}`, 20, 90);
      doc.save(`Ocorrencia_${nome}.pdf`);
    }
  </script>
</body>
</html>
