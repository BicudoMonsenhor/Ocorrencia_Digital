
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Listar Ocorrências</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; padding: 20px; }
    h2 { text-align: center; color: #333; }
    input {
      width: 100%; padding: 10px; margin-bottom: 20px;
      font-size: 16px; border: 1px solid #ccc; border-radius: 5px;
    }
    .resultado {
      background: white; padding: 15px; border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1); margin-bottom: 15px;
    }
    .resultado p { margin: 5px 0; }
  </style>
</head>
<body>
  <h2>Buscar Ocorrências por Nome do Aluno</h2>
  <input type="text" id="filtro" placeholder="Digite o nome do aluno..." />
  <div id="resultados"></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDBe67kG6oru6nUMTrazQFDeMlZWrWZbzY",
      authDomain: "registro-ocorrencia.firebaseapp.com",
      projectId: "registro-ocorrencia",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("filtro").addEventListener("input", async function () {
      const nome = this.value.trim().toLowerCase();
      const container = document.getElementById("resultados");
      container.innerHTML = "";
      if (nome.length < 3) return;

      const snapshot = await db.collection("ocorrencias").get();
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.nomeAluno.toLowerCase().includes(nome)) {
          const div = document.createElement("div");
          div.className = "resultado";
          div.innerHTML = `
            <p><strong>Aluno:</strong> ${data.nomeAluno}</p>
            <p><strong>Série:</strong> ${data.serie}</p>
            <p><strong>Professor:</strong> ${data.professor}</p>
            <p><strong>Ocorrências:</strong> ${data.ocorrencias.join(", ")}</p>
            <p><strong>Descrição:</strong> ${data.descricao}</p>
            <p><strong>Assinatura:</strong> ${data.assinatura}</p>
            <p><strong>Data:</strong> ${data.dataHora}</p>
          `;
          container.appendChild(div);
        }
      });
    });
  </script>
</body>
</html>
