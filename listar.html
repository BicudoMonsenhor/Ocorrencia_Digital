
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Ocorrências</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">Buscar Ocorrências por Nome</h2>
    <input type="text" id="buscaNome" class="form-control mb-4" placeholder="Digite o nome do aluno" oninput="buscarOcorrencias()" />
    <div id="listaOcorrencias"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBAJt0ODcZjiQ8iM9fPEb5tWlNjKyZKtWw",
      authDomain: "ocorrencia-e5e70.firebaseapp.com",
      databaseURL: "https://ocorrencia-e5e70-default-rtdb.firebaseio.com",
      projectId: "ocorrencia-e5e70",
      storageBucket: "ocorrencia-e5e70.appspot.com",
      messagingSenderId: "417013595919",
      appId: "1:417013595919:web:4fce0d291afcbe43fd887a",
      measurementId: "G-S3PCP1HSMT"
    };

    firebase.initializeApp(firebaseConfig);

    function buscarOcorrencias() {
      const termo = document.getElementById('buscaNome').value.toLowerCase();
      const lista = document.getElementById('listaOcorrencias');
      lista.innerHTML = "";

      firebase.database().ref("ocorrencias").once("value", function(snapshot) {
        snapshot.forEach(function(childSnapshot) {
          const o = childSnapshot.val();
          if (o.nomeAluno.toLowerCase().includes(termo)) {
            const item = document.createElement('div');
            item.className = "bg-white p-3 mb-2 border rounded";
            item.innerHTML = `<strong>Aluno:</strong> ${o.nomeAluno}<br>
                              <strong>Série:</strong> ${o.serie}<br>
                              <strong>Professor:</strong> ${o.professor}<br>
                              <strong>Data:</strong> ${o.dataHora}<br>
                              <strong>Ocorrência:</strong> ${o.descricao}`;
            lista.appendChild(item);
          }
        });
      });
    }
  </script>
</body>
</html>
